name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: End-to-end run on a small sample
        run: |
          mkdir -p data/raw data/bronze data/silver data/gold
          python src/generate_claims.py --rows 50000 --out data/raw/claims.csv
          python spark/bronze.py
          python spark/silver.py
          cd dbt
          dbt run --profiles-dir . --target duckdb
          dbt test --profiles-dir . --target duckdb
